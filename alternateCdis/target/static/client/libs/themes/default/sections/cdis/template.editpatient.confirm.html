<div id="grvPatientConfirm" class="cdisPatientConfirm">
<div class="body">
      	<div class="row">
     			<div class="label" >First Name</div><div class="value" id="fname" type="text"></div>
     		</div>
     		<div class="row">
     			<div class="label">Last Name</div><div class="value" id="lname" type="text"></div>
     		</div>
     		<div class="row">
     			<div class="label" >Ramq</div><div class="value" id="ramq" type="text"></div>
     		</div>
     		<div class="row">	
     			<div class="label" >Chart</div><div class="value" id="chart" type="text"></div>
     		</div>
     		<div class="row">
     			<div class="label" >IPM</div><div class="value" id="giu" type="text"></div>
     		</div>
     		<div class="row">
     			<div class="label" >Band</div><div class="value" id="band" type="text"></div>
     		</div>
     		<div class="row">
     			<div class="label" >Community</div><div class="value" id="idcommunity" type="select"></div>
     		</div>
      		<div class="row">
     			<div class="label" >Gender</div><div class="value" id="sex" type="grvradio"></div>
     		</div>
     		<div class="row">
     			<div class="label" >Date of birth</div><div class="value" id="dob" type="grvdatepicker"></div>
     		</div>
     		<div class="row">
     			<div class="label" >Is patient Cree</div><div class="value" id="cree" type="grvradio"></div>
     		</div>
     		<div class="row">
     			<div class="label" >Diabetes type</div><div class="value" id="dtype" type="select"></div>
     		</div>
     		<div class="row">
     			<div class="label" >Date of diagnosis</div><div class="value" id="ddate" type="grvdatepicker"></div>
     		</div>
     		<div class="row">
     			<div class="label" >Is Patient Dead</div><div class="value" id="deceased" type="grvradio"></div>
     		</div>
     		<div class="row deceasedCondition">
     			<div class="label" >Date of death</div><div class="value" id="dod" type="grvdatepicker"></div>
     		</div>
     		<div class="row deceasedCondition">
     			<div class="label" >Death cause</div><div class="value" id="dcause" type="text"></div>
     		</div>
     		<div class="row">
     			<div class="label" >PCCR</div><div class="value" id="chr" type="grvautocomplete"></div>
     		</div>
     		<div class="row">
     			<div class="label" >MD</div><div class="value" id="md" type="grvautocomplete"></div>
     		</div>
     		<div class="row">
     			<div class="label" >Nurse</div><div class="value" id="nur" type="grvautocomplete"></div>
     		</div>
     		<div class="row">
     			<div class="label" >Nutritionist</div><div class="value" id="nut" type="grvautocomplete"></div>
     		</div>
     		<!-- hidden values -->
     		<div class="value" id="jbnqa" value="0" type="text"></div>
    </div>
</div>
